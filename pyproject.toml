[build-system]
requires=["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name="consumer-churn-Prediction"
version="1.0.0"
requires-python=">=3.12"
description="Consumer Churn Prediction model predicts weather the consumer will leave the service or not"
dependencies=[
    "cloudpickle==3.1.2",
    "fastapi==0.141.1",
    "numpy==2.4.1",
    "pandas==2.3.3",
    "pydantic==2.13.5",
    "scikit-learn==1.8.0",
    "uvicorn==0.52.4"
]
[project.optional-dependencies]
dev=[
    "pytest=8.0"
]
[tool.setuptools.packages.find]
where = ["src"]
